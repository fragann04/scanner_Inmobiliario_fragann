<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceder — Scanner REO</title>
<meta name="robots" content="noindex">
<style>
  :root { --azul:#0b1f3a; --azul2:#16365c; --dorado:#c9a24b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f4f6f9; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:20px; }
  .caja { background:#fff; border-radius:14px; box-shadow:0 6px 26px rgba(0,0,0,.14);
          padding:34px 30px; max-width:420px; width:100%; }
  h1 { color:var(--azul); font-size:21px; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#666; font-size:13px; margin-bottom:20px; }
  label { display:block; font-size:11px; font-weight:bold; color:#555;
          text-transform:uppercase; letter-spacing:.4px; margin:14px 0 4px; }
  input { width:100%; padding:12px; font-size:16px; border:1.5px solid #ccd6e6;
          border-radius:8px; }
  input:focus { outline:none; border-color:var(--azul2); }
  button { width:100%; margin-top:18px; padding:13px; font-size:16px; font-weight:bold;
           color:#fff; background:var(--dorado); border:none; border-radius:8px;
           cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  #msg { font-size:13px; text-align:center; margin-top:12px; min-height:18px; }
  .err { color:#c0392b; } .ok { color:#1a9d57; }
  .beta { background:#e8edf5; border:1px solid #b9cdf0; border-radius:8px;
          padding:10px 12px; font-size:12px; color:#33507a; margin-top:16px; }
  .pie { text-align:center; font-size:12px; color:#888; margin-top:18px; }
  .pie a { color:var(--azul); }
</style>
</head>
<body>
<div class="caja">
  <h1>👤 Acceder al Scanner REO</h1>
  <div class="sub">Tu clave se valida en cada acceso.</div>

  <label for="email">Tu email</label>
  <input id="email" type="email" placeholder="tu@email.com" autocomplete="email">

  <label for="clave">Tu clave de acceso</label>
  <input id="clave" type="password" placeholder="La que elegiste al registrarte"
         autocomplete="current-password">

  <button id="entrar">Entrar a explorar</button>
  <div id="msg"></div>

  <div class="beta" id="beta-info" style="display:none"></div>

  <div class="pie">
    ¿Aún sin cuenta? <a href="index.html#alta">Apúntate a la beta gratuita</a><br>
    ¿Olvidaste tu clave? Vuelve a
    <a href="index.html#alta">registrarte con tu mismo email</a> y una clave
    nueva — quedará activa al momento.
  </div>
</div>

<script>
const SALT = "REO2026";

function slugify(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

async function sha256(txt) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// 1) Si llega con enlace personal (#t=...), guardar la cuenta en este navegador
function cargarToken() {
  const m = location.hash.match(/t=([A-Za-z0-9_-]+)/);
  if (!m) return;
  try {
    const pad = "=".repeat((4 - m[1].length % 4) % 4);
    const bin = atob(m[1].replace(/-/g, "+").replace(/_/g, "/") + pad);
    // atob devuelve Latin-1: decodificar como UTF-8 (tildes, ñ…)
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const cuenta = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    if (cuenta.e && cuenta.p && cuenta.h) {
      const cuentas = JSON.parse(localStorage.getItem("reo_cuentas") || "{}");
      cuentas[cuenta.e] = cuenta;
      localStorage.setItem("reo_cuentas", JSON.stringify(cuentas));
      document.getElementById("email").value = cuenta.e;
      const b = document.getElementById("beta-info");
      b.style.display = "block";
      b.innerHTML = "✅ Cuenta vinculada a este navegador.<br>Durante la beta " +
                    "exploras <b>las 52 provincias</b> de España " +
                    "(tu referencia: " + cuenta.p + "). " +
                    "Escribe tu clave para entrar.";
      history.replaceState(null, "", location.pathname); // limpiar el token de la URL
    }
  } catch (e) { /* token inválido: se ignora */ }
}
cargarToken();
window.addEventListener("hashchange", cargarToken);  // por si llega el enlace
                                                     // estando ya en la página

// Prefijar el email de la última cuenta usada/creada en este navegador
(function () {
  const ult = localStorage.getItem("reo_ultimo");
  const campo = document.getElementById("email");
  if (ult && !campo.value) campo.value = ult;
})();

// Busca la cuenta por email: 1º en este navegador (rápido), 2º en el servidor
// (archivo publicado, nombrado por el hash del email — así funciona en
// cualquier navegador/dispositivo sin el enlace personal).
async function buscarCuenta(email) {
  const cuentas = JSON.parse(localStorage.getItem("reo_cuentas") || "{}");
  if (cuentas[email]) return cuentas[email];
  try {
    const idFile = await sha256(email);   // sha256(email) = nombre del archivo
    const r = await fetch("cuentas/" + idFile + ".json", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();           // { p: provincia, h: hash_clave }
      const cuenta = { e: email, p: d.p, h: d.h };
      cuentas[email] = cuenta;            // cachear para próximas veces
      localStorage.setItem("reo_cuentas", JSON.stringify(cuentas));
      return cuenta;
    }
  } catch (e) { /* sin conexión o cuenta inexistente */ }
  return null;
}

// 2) Validación en cada acceso: email + clave contra el hash de la cuenta
async function entrar() {
  const msg = document.getElementById("msg");
  const email = document.getElementById("email").value.trim().toLowerCase();
  const clave = document.getElementById("clave").value;
  if (!email || !clave) {
    msg.className = "err"; msg.textContent = "Escribe tu email y tu clave."; return;
  }
  msg.className = "ok"; msg.textContent = "Comprobando…";
  const cuenta = await buscarCuenta(email);
  if (!cuenta) {
    msg.className = "err";
    msg.innerHTML = "No encontramos una cuenta con ese email.<br>" +
      "¿Seguro que es el email con el que te registraste? Si aún no tienes " +
      "cuenta, <a href='index.html#alta'>apúntate a la beta gratuita</a>.";
    return;
  }
  const h = await sha256(email + "|" + clave + "|" + SALT);
  if (h !== cuenta.h) {
    msg.className = "err";
    msg.textContent = "Clave incorrecta. Es la que elegiste al registrarte.";
    return;
  }
  // sesión de acceso (se revalida en cada entrada a la página de acceso)
  const slug = slugify(cuenta.p);
  sessionStorage.setItem("reo_session", JSON.stringify(
    { e: email, p: cuenta.p, slug: slug, t: Date.now() }));
  localStorage.setItem("reo_ultimo", email);
  msg.textContent = "✓ Acceso correcto. Abriendo " + cuenta.p + "…";
  const destino = "explorador-" + slug + ".html";
  // ¿su provincia ya tiene datos publicados?
  try {
    const r = await fetch(destino, { method: "HEAD" });
    if (!r.ok) throw new Error("sin datos");
    location.href = destino;
  } catch (e2) {
    if (location.protocol === "file:") { location.href = destino; return; }
    msg.className = "ok";
    msg.innerHTML = "✓ Acceso correcto.<br><b>" + cuenta.p + " se está activando</b> — " +
      "el radar de tu provincia entra en marcha en breve y te avisaremos por email. " +
      "Gracias por la paciencia 🙏";
  }
}
document.getElementById("entrar").addEventListener("click", entrar);
document.getElementById("clave").addEventListener("keydown",
  e => { if (e.key === "Enter") entrar(); });
</script>
</body>
</html>
