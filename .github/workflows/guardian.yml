# Mantenimiento del sitio después de cada envío.
#
# La web se publica subiendo la carpeta local entera. Si esa carpeta no está
# al día, la subida sobrescribe las páginas y se lleva por delante lo que se
# haya añadido aquí. Pasó el 18/09/2026: explorar.html, acceso.html y
# marcador.html dejaron de contar visitas sin que nadie se enterara.
#
# Este trabajo se ejecuta después de cada envío a main y hace dos cosas:
#
#   1. Repone la medición y la marca si la subida las ha borrado.
#   2. Regenera las páginas públicas por provincia con los datos del día,
#      que son las únicas del inventario que Google puede indexar (los 52
#      exploradores piden clave).
#
# Si no hace falta cambiar nada, no deja ningún commit.
name: Mantenimiento del sitio

on:
  push:
    branches: [main]
  workflow_dispatch:      # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: write         # necesita escribir para reponer y regenerar

# Si llegan dos envíos seguidos, que no se pisen entre ellos.
concurrency:
  group: mantenimiento-sitio
  cancel-in-progress: false

jobs:
  mantener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reponer la medición y la marca si faltan
        run: python3 .github/guardian.py

      - name: Regenerar las páginas públicas por provincia
        run: python3 .github/provincias.py

      - name: Publicar los cambios si hacía falta
        run: |
          if git diff --quiet; then
            echo "Nada que publicar."
            exit 0
          fi
          echo "Cambios detectados:"
          git diff --stat
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mantenimiento: medicion, marca y paginas por provincia"
          git push
